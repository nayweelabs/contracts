  tags: [feature, 'epic:license', 'feature:license-check', 'product:contracts']
  description: "## Why\n\nThe owner chose on 27 Nov: the trial is a rule in mankit, not a signed key, and its only file is a plain start note. A user holds many licenses, and each app has one active license. contracts gives both their shape, additive, as v2.2.0.\n\n## What\n\n- mankit/v4/trial-started.schema.json: the trial note, a Resource of elderlygate/mankit/trial/v1 (kind TrialStarted), with day, binary and fileTime taken from the v3 license file's started record; a forms.yaml row; samples good and bad.\n- mankit/v4/license-show.schema.json: LicenseShow marks the active license and gives the trial as its own field, made by the rule, not by a file. v3's LicenseShow allows no extra field (CT-RULE-1, CT-RULE-4), so this is a new version, with its upgrade step from v3 (CT-RULE-3).\n- The v3 payload's trial kind is left as released: its kind is a fixed list, so CT-RULE-1 allows no description change.\n\n## Done when\n\n- [x] trial note schema, sample, good and bad samples, forms.yaml row\n- [x] LicenseShow v4 schema, sample, good and bad samples\n- [x] upgrade step v3 to v4 with pairs and refused samples\n- [x] README names mankit/v4\n- [x] go test ./... passes\n\n## Open\n\nnone\n"
