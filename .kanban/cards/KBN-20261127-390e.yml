  tags: [feature, 'epic:license', 'feature:license-check', 'product:contracts']
  description: "## Why\n\nThe owner chose on 27 Nov: the trial is a rule in mankit, not a signed key, and its only file is a plain start note. A user holds many licenses, and each app has one active license (ADR-L8, L9). contracts gives both their shape, additive, as v2.2.0.\n\n## What\n\nNo app has released anything on mankit/v3 yet (mankit pins v0.46.0, e-designer v0.42.0), so CT-RULE-1 does not freeze it: mankit/v3 is corrected in place, with no mankit/v4.\n\n- mankit/v3/trial-started.schema.json: the trial note, a Resource of elderlygate/mankit/trial/v1 (kind TrialStarted, metadata.id the product id), whose day, binary and fileTime are written there; a forms.yaml row; samples good and bad.\n- mankit/v3/license-show.schema.json: each license has its id, place (org or app), active (at most one) and optional issued, and no kind; the trial is data.trial.\n- mankit/v3 license payload has one kind, license; the license file has no started record.\n- UpgradeLicenseShow refuses a v2 answer that lists a license, as v2 has no id or place; a trial goes to data.trial.\n- problem/v1 reason gains retired_kind.\n\n## Done when\n\n- [x] trial note schema, sample, good and bad samples, forms.yaml row\n- [x] LicenseShow, payload and license file corrected, with their samples\n- [x] upgrade step v2 to v3 and its pairs updated\n- [x] README names the trial note's form\n- [x] go test ./... passes\n\n## Open\n\nnone\n"
