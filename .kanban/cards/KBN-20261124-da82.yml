    # AgentInstructions schema and sample

    ## Why
    Step 1 of the epic "AI instructions: Designer guides any AI, user can see and override": the shared shape of the instructions, so every step reads and writes the same file.

    ## What
    - Add designer/v2/agent-instructions.schema.json and designer/v2/samples/agent-instructions.json (invented content).
    - Add a forms.yaml row elderlygate/designer/agent/v1 (kind AgentInstructions, no old forms), named like the other forms; the org rename's phase 2 renames apiVersions later.
    - spec.rules[] holds rules, each with an id (G-STACK-17 id form) and a text; an override can remove a rule by id.
    - Field meanings live only in the schema (CT-RULE-5).
    - Additive new kind, no new designer contract version (CT-RULE-1).

    ## Done when
    - [x] The schema and the sample pass the repo's tests.
    - [x] The forms row is listed.

