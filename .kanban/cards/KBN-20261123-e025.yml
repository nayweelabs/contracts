  description: |
    #feature #epic:license #feature:app-features #product:contracts

    # Feature ids follow G-STACK-17 in the license format

    Org rule G-STACK-17 (owner, 2026-11-23) gives a feature id one form: lowercase words joined by a hyphen, starting with a letter, at most 32 characters, never a tier or price word. Today `mankit/v1` `defs.schema.json` `featureState.id` is any non-empty string, and the license payload's feature ids point to it.

    Work, with the purchase MVP: the next license format version carries the pattern (`^[a-z][a-z0-9]*(-[a-z0-9]+)*$`, `maxLength` 32) for feature ids, with its meaning in the description (CT-RULE-5). The pattern narrows what a license may name, so it is a new apiVersion, not a change to v1 (CT-RULE-1), and comes with the same version as the `lines` field.

    Backlog; not started.
