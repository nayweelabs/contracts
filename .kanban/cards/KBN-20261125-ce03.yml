  description: |
    #feature #epic:license #feature:license-check #product:mankit

    # license show: a trial's end apart from its offer's end

    mankit/v1 license show gives a release-trial two optional days in its license entry, so a reader never has to guess what until means for it:

    - `trialEnds`: on a release-trial with a started record, the last day of the trial it started (spec.started.day plus days, less one).
    - `offerEnds`: on every release-trial, the day its trial offer ends, the key's signed until.

    `until` keeps its values; its description says a reader shows trialEnds and offerEnds for a release-trial, never until. The license payload's `until` description says, for a release-trial, the day its trial offer ends. Additive, so a minor (CT-RULE-1).

    Waits on: nothing.

    Done when: the schemas carry both fields with their rules, good and bad testdata cover them, `go test ./...` passes and the PR is green.
