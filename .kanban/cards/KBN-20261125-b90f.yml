    # mankit/v2 answers on envelope/v2

    ## Why

    designer/app/v2 is on envelope/v2, but mankit's own answers (help, servers, queue, store, license show) have schemas only on envelope/v1. An app on envelope/v2 needs them on its envelope too (step C5 of the designer-v2 epic).

    ## What

    - `mankit/v2/`: Help, Link, QueueList, QueueSettings, ServerList, StoppedList, StoreUnfinishedList, StoreUnfinishedCleared, LicenseShow, each envelope/v2 plus its kind and a `$ref` to v1's data. The data keeps one home, in v1's `$defs/data`.
    - `mankit/v1/`: each answer's inline data moves to `$defs/data`; v1 accepts exactly the same documents (CT-RULE-1).
    - A sample and good and bad cases per v2 kind; the upgrade step v1 to v2 (CT-RULE-3).
    - Apps on envelope/v1 (kanban, nw-license) keep mankit/v1. No forms.yaml row: mankit answers carry their app's apiVersion.

    ## Done when

    - [x] every mankit answer kind has a mankit/v2 schema and sample
    - [x] v1's existing samples, good and bad cases give the same results
    - [x] the upgrade step is tested with pairs and refusals
    - [x] go test ./... passes

    ## Open

