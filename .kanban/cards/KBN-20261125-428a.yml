    # contracts keeps only the latest version

    #feature #epic:naywee #feature:naywee-names #product:contracts

    ## Why

    The owner: "this is the milestone; nobody is using the files now; make it clear". No old files to read, no migration, no upgrade steps for old versions. One break, in the same contracts v1.0.0 as the licenser rename.

    ## What

    - Delete envelope/v1, mankit/v1 and designer/v1: schemas, samples, testdata, forms.yaml rows, README rows.
    - Delete every upgrade step (UpgradeEnvelope, UpgradeMankit, UpgradeDesigner) with its tests and testdata/upgrade.
    - What a v2 schema took from a v1 file moves into v2, so v2 stands alone (one home): mankit/v2 holds every mankit shape.
    - licenser/v1, version/v1 and question/v1 answer on envelope/v2 only, in place (no version bump).

    ## Done when

    - [ ] No file refers to envelope/v1, mankit/v1 or designer/v1.
    - [ ] No upgrade step or upgrade testdata is left.
    - [ ] Every test case of a deleted mankit/v1 answer that v2 lacks is kept, on envelope/v2.
    - [ ] go test ./... green and CI green.

