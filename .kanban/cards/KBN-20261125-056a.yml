    #feature #epic:agent-instructions #feature:agent-instructions #product:contracts

    # agent show answer schema

    ## Why
    `nw-designer agent show -o json` answers the merged agent rules with each rule's origin. The CLI, its HTTP door and the Settings page need one contract for that answer, and a field's meaning lives only in the schema (CT-RULE-5). The file form (AgentInstructions) is closed and has no origin, so the merged answer needs its own kind.

    ## What
    - New answer kind AgentInstructionsShow in designer/v1 and designer/v2 (e-designer answers designer/app/v1 today; v2 keeps every kind of v1).
    - Data: the merged rules, each id, text and origin (built-in, machine, project), and the three levels read, each with its path (none for built-in) and whether a file was found.
    - Rule id and text point at the AgentInstructions schema, their one home.
    - Samples, more samples, bad samples, the forms.yaml rows, and an upgrade pair v1 to v2.

    ## Done when
    - [ ] designer/v1 and designer/v2 hold agent-instructions-show.schema.json with a sample each
    - [ ] forms.yaml lists AgentInstructionsShow under designer/app/v1 and designer/app/v2
    - [ ] bad samples show a removed rule, an unknown origin and a path on built-in are refused
    - [ ] `go test ./...` passes

    ## Open
    none
