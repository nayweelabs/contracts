  description: |
    #fix #epic:naywee #feature:naywee-names #product:contracts

    # Module path go.naywee.com/contracts/v2

    v2.0.0 is tagged, but go.mod still names the module without a /v2 suffix, so Go refuses it ("module path must match major version"). The module path becomes `go.naywee.com/contracts/v2` (V-11). The go.mod, the test import and the README's Go lines follow it. The schemas' `$id` URLs stay: they are part of released schemas (CT-RULE-1).

    Waits on: the vanity page for go.naywee.com/contracts/v2.

    Done when: `go test ./...` is green and, with GOPROXY=direct, `go list -m go.naywee.com/contracts/v2@<branch commit>` resolves.
